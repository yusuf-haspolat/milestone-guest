<!doctype html>
<!--
  Gugupic — grandparent guest view (GitHub Pages: yusuf-haspolat/milestone-guest).
  Cloudflare Pages was the first choice but *.pages.dev is DNS+SNI blocked
  in Türkiye (checked 2026-08-01), where the family lives.
  One self-contained file: reads the guest token from ?t=, fetches the
  timeline JSON from the Supabase `guest` Edge Function, renders it.
  All user data goes through textContent / DOM APIs — never innerHTML —
  so nothing in a child name, caption or comment can execute here.
  Read-only by design: guests are anonymous, so comments are shown but
  there is no way to write one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gugupic</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: #0A1622; color: #E8EDF2;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.5;
  }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; padding-bottom: 4px; }
  .sub { color: #9FB0C0; padding-bottom: 24px; }
  figure, .card {
    background: #122233; border: 1px solid #1E3348; border-radius: 14px;
    overflow: hidden; margin-bottom: 20px;
  }
  figure img, figure video { width: 100%; display: block; min-height: 120px; }
  /* Videos are never cropped: a face cut in half is worse than a letterbox. */
  figure video { background: #000; }
  figcaption { padding: 10px 14px; color: #9FB0C0; font-size: 0.95rem; }
  /* Milestone cards wear the accent border — they are the highlights. */
  .card.milestone { border-color: #4ADE80; border-width: 2px; }
  .card-body { padding: 14px; }
  .m-head { display: flex; align-items: center; gap: 10px; }
  .m-badge { font-size: 1.8rem; line-height: 1; }
  .m-title { font-weight: 600; }
  .m-meta, .c-date { color: #9FB0C0; font-size: 0.9rem; }
  .m-note { padding-top: 8px; }
  /* Many photos per milestone: a grid of thumbs, each opening full size. */
  .grid {
    display: grid; gap: 8px; padding: 0 14px 14px;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  }
  .grid.single { grid-template-columns: 1fr; padding: 0; }
  .grid img, .grid video { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; display: block; }
  .grid video { object-fit: contain; background: #000; }
  .grid.single img, .grid.single video { height: auto; border-radius: 0; }
  .comments { border-top: 1px solid #1E3348; padding: 12px 14px; display: grid; gap: 10px; }
  .comment .c-author { font-weight: 600; font-size: 0.95rem; }
  .comment .c-body { font-size: 0.95rem; }
  .center { text-align: center; padding: 30vh 16px 0; }
  .center h1 { font-size: 1.4rem; padding-bottom: 8px; }
  .empty { color: #9FB0C0; text-align: center; padding: 48px 0; }
  footer { color: #56687A; text-align: center; font-size: 0.85rem; padding-top: 24px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto;
    border: 3px solid #1E3348; border-top-color: #4ADE80; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="app">
  <div class="center"><div class="spinner"></div></div>
</main>

<script>
  const API = 'https://puqyeamomjzgamhqchrd.supabase.co/functions/v1/guest';

  // Mirrors app/src/constants/milestone-templates.ts; unknown keys and
  // custom milestones fall back to the generic badge.
  const BADGES = {
    first_smile: '😊', first_tooth: '🦷', first_words: '💬', first_crawl: '🍼',
    first_step: '👣', first_haircut: '✂️', first_birthday: '🎂',
    first_day_of_school: '🎒',
  };
  const badgeFor = (key) => BADGES[key] || '🏅';

  /**
   * Language follows the BROWSER, not the app.
   *
   * The person reading this page is not the person who set the language in
   * Gugupic — that is the whole point of a guest link. Their own browser
   * is the only thing here that knows what they read, so it decides. There
   * is deliberately nothing to configure and nothing stored: a grandmother
   * opening a link on a Turkish phone gets Turkish without being asked.
   */
  const LANG_TAG = (navigator.language || 'en').toLowerCase().split(/[-_]/)[0];

  const STRINGS = {
    en: {
      title: (name) => name + "'s timeline",
      sub: (name) =>
        name + "'s growth story, moment by moment. Tap a photo to see it full size, or press play on a video.",
      empty: 'Nothing here yet — check back soon!',
      footer: 'Shared privately with you via Gugupic.',
      errorTitle: "This link isn't available",
      errorBody: 'It may have expired or been turned off. Ask the family to send you a fresh one.',
      months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
      date: (d, month, y) => d + ' ' + month + ' ' + y,
      age: {
        day: (n) => (n === 1 ? '1 day old' : n + ' days old'),
        months: (m) => (m === 1 ? '1 month old' : m + ' months old'),
        monthsDays: (m, d) =>
          (m === 1 ? '1 month' : m + ' months') + ', ' + (d === 1 ? '1 day' : d + ' days') + ' old',
        years: (y) => (y === 1 ? '1 year old' : y + ' years old'),
        yearsMonths: (y, m) =>
          (y === 1 ? '1 year' : y + ' years') + ', ' + (m === 1 ? '1 month' : m + ' months') + ' old',
      },
    },
    tr: {
      title: (name) => name + ' — zaman tüneli',
      sub: (name) =>
        name + ' adlı çocuğun büyüme hikâyesi, an be an. Fotoğrafa dokunup tam boy görebilir, videoda oynata basabilirsin.',
      empty: 'Burada henüz bir şey yok — yakında tekrar bak!',
      footer: 'Gugupic üzerinden sana özel olarak paylaşıldı.',
      errorTitle: 'Bu bağlantı kullanılamıyor',
      errorBody: 'Süresi dolmuş ya da kapatılmış olabilir. Aileden yeni bir tane istemen yeterli.',
      months: ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'],
      date: (d, month, y) => d + ' ' + month + ' ' + y,
      age: {
        day: (n) => n + ' günlük',
        months: (m) => m + ' aylık',
        monthsDays: (m, d) => m + ' ay ' + d + ' günlük',
        years: (y) => y + ' yaşında',
        yearsMonths: (y, m) => y + ' yaş ' + m + ' aylık',
      },
    },
    de: {
      title: (name) => 'Die Chronik von ' + name,
      sub: (name) =>
        'Wie ' + name + ' wächst, Moment für Moment. Tippe ein Foto an, um es groß zu sehen, oder starte ein Video.',
      empty: 'Hier ist noch nichts — schau bald wieder vorbei!',
      footer: 'Privat mit dir geteilt über Gugupic.',
      errorTitle: 'Dieser Link ist nicht verfügbar',
      errorBody: 'Er ist vielleicht abgelaufen oder wurde abgeschaltet. Bitte die Familie um einen neuen.',
      months: ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
      date: (d, month, y) => d + '. ' + month + ' ' + y,
      age: {
        day: (n) => (n === 1 ? '1 Tag alt' : n + ' Tage alt'),
        months: (m) => (m === 1 ? '1 Monat alt' : m + ' Monate alt'),
        monthsDays: (m, d) =>
          (m === 1 ? '1 Monat' : m + ' Monate') + ', ' + (d === 1 ? '1 Tag' : d + ' Tage') + ' alt',
        years: (y) => (y === 1 ? '1 Jahr alt' : y + ' Jahre alt'),
        yearsMonths: (y, m) =>
          (y === 1 ? '1 Jahr' : y + ' Jahre') + ', ' + (m === 1 ? '1 Monat' : m + ' Monate') + ' alt',
      },
    },
    es: {
      title: (name) => 'La línea de tiempo de ' + name,
      sub: (name) =>
        'La historia de cómo crece ' + name + ', momento a momento. Toca una foto para verla en grande, o dale al play en un vídeo.',
      empty: 'Todavía no hay nada aquí. ¡Vuelve pronto!',
      footer: 'Compartido contigo en privado a través de Gugupic.',
      errorTitle: 'Este enlace no está disponible',
      errorBody: 'Puede que haya caducado o se haya desactivado. Pide a la familia que te envíe otro.',
      months: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
      date: (d, month, y) => d + ' de ' + month + ' de ' + y,
      age: {
        day: (n) => (n === 1 ? '1 día' : n + ' días'),
        months: (m) => (m === 1 ? '1 mes' : m + ' meses'),
        monthsDays: (m, d) =>
          (m === 1 ? '1 mes' : m + ' meses') + ' y ' + (d === 1 ? '1 día' : d + ' días'),
        years: (y) => (y === 1 ? '1 año' : y + ' años'),
        yearsMonths: (y, m) =>
          (y === 1 ? '1 año' : y + ' años') + ' y ' + (m === 1 ? '1 mes' : m + ' meses'),
      },
    },
    fr: {
      title: (name) => 'Le journal de ' + name,
      sub: (name) =>
        'L’histoire de ' + name + ' qui grandit, moment après moment. Touche une photo pour la voir en grand, ou lance une vidéo.',
      empty: 'Rien ici pour l’instant — reviens bientôt !',
      footer: 'Partagé avec toi en privé via Gugupic.',
      errorTitle: 'Ce lien n’est pas disponible',
      errorBody: 'Il a peut-être expiré ou été désactivé. Demande à la famille de t’en envoyer un nouveau.',
      months: ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],
      date: (d, month, y) => d + ' ' + month + ' ' + y,
      age: {
        day: (n) => (n === 1 ? '1 jour' : n + ' jours'),
        months: (m) => m + ' mois',
        monthsDays: (m, d) =>
          m + ' mois et ' + (d === 1 ? '1 jour' : d + ' jours'),
        years: (y) => (y === 1 ? '1 an' : y + ' ans'),
        yearsMonths: (y, m) => (y === 1 ? '1 an' : y + ' ans') + ' et ' + m + ' mois',
      },
    },
    pt: {
      title: (name) => 'A linha do tempo de ' + name,
      sub: (name) =>
        'A história de ' + name + ' crescendo, momento a momento. Toque em uma foto para ver em tamanho grande, ou dê play em um vídeo.',
      empty: 'Ainda não há nada aqui — volte em breve!',
      footer: 'Compartilhado com você em particular pelo Gugupic.',
      errorTitle: 'Este link não está disponível',
      errorBody: 'Ele pode ter expirado ou sido desativado. Peça um novo para a família.',
      months: ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'],
      date: (d, month, y) => d + ' de ' + month + ' de ' + y,
      age: {
        day: (n) => (n === 1 ? '1 dia' : n + ' dias'),
        months: (m) => (m === 1 ? '1 mês' : m + ' meses'),
        monthsDays: (m, d) =>
          (m === 1 ? '1 mês' : m + ' meses') + ' e ' + (d === 1 ? '1 dia' : d + ' dias'),
        years: (y) => (y === 1 ? '1 ano' : y + ' anos'),
        yearsMonths: (y, m) =>
          (y === 1 ? '1 ano' : y + ' anos') + ' e ' + (m === 1 ? '1 mês' : m + ' meses'),
      },
    },
    it: {
      title: (name) => 'Il diario di ' + name,
      sub: (name) =>
        'La storia di ' + name + ' che cresce, momento per momento. Tocca una foto per vederla grande, o avvia un video.',
      empty: 'Qui non c’è ancora niente — torna presto!',
      footer: 'Condiviso con te in privato tramite Gugupic.',
      errorTitle: 'Questo link non è disponibile',
      errorBody: 'Potrebbe essere scaduto o essere stato disattivato. Chiedi alla famiglia di mandartene uno nuovo.',
      months: ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],
      date: (d, month, y) => d + ' ' + month + ' ' + y,
      age: {
        day: (n) => (n === 1 ? '1 giorno' : n + ' giorni'),
        months: (m) => (m === 1 ? '1 mese' : m + ' mesi'),
        monthsDays: (m, d) =>
          (m === 1 ? '1 mese' : m + ' mesi') + ' e ' + (d === 1 ? '1 giorno' : d + ' giorni'),
        years: (y) => (y === 1 ? '1 anno' : y + ' anni'),
        yearsMonths: (y, m) =>
          (y === 1 ? '1 anno' : y + ' anni') + ' e ' + (m === 1 ? '1 mese' : m + ' mesi'),
      },
    },
  };

  /**
   * The browser's language if this page speaks it, English otherwise. The
   * primary subtag is all that is read, so `pt-BR`, `pt-PT` and bare `pt` all
   * land on the one Portuguese table.
   */
  const LANG = Object.prototype.hasOwnProperty.call(STRINGS, LANG_TAG) ? LANG_TAG : 'en';
  const S = STRINGS[LANG];

  /** "3 days old", "6 months, 12 days old", "2 years, 1 month old". */
  function formatAgeDays(ageDays) {
    if (ageDays === null || ageDays === undefined || ageDays < 0) return '';
    if (ageDays < 60) return S.age.day(ageDays);
    const months = Math.floor(ageDays / 30.44);
    if (months < 24) {
      const days = Math.round(ageDays - months * 30.44);
      return days > 0 ? S.age.monthsDays(months, days) : S.age.months(months);
    }
    const years = Math.floor(ageDays / 365.25);
    const rem = Math.floor((ageDays - years * 365.25) / 30.44);
    return rem > 0 ? S.age.yearsMonths(years, rem) : S.age.years(years);
  }

  /**
   * `YYYY-MM-DD` → "14 March 2025", read straight off the string. Not
   * `toLocaleDateString`, for the same reason the app avoids it: parsing a
   * bare date through `Date` reports UTC midnight in local time, which shows
   * the previous day for anyone west of Greenwich.
   *
   * The order is the language's own (`S.date`), because it is not universal:
   * German writes "14. März 2025", Spanish and Portuguese "14 de marzo de
   * 2025". This page had the English order hard-coded until the five new
   * languages arrived on 2026-08-21.
   */
  function formatDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return iso || '';
    const month = Number(m[2]);
    if (month < 1 || month > 12) return iso;
    return S.date(Number(m[3]), S.months[month - 1], m[1]);
  }

  // el('p', {class: 'sub'}, 'text') — tiny DOM builder; text stays text.
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
    for (const c of children) if (c !== null && c !== undefined && c !== false) node.append(c);
    return node;
  }

  function showError() {
    const app = document.getElementById('app');
    app.replaceChildren(
      el('div', { class: 'center' },
        el('h1', {}, S.errorTitle),
        el('p', { class: 'sub' }, S.errorBody))
    );
  }

  /**
   * A video plays right here, in the page — grandparents shouldn't have to
   * work out that a still with a triangle on it is a different kind of
   * link. `preload="none"` keeps the poster cheap on a phone connection;
   * the bytes only move when they press play. There is no transcoding, so
   * `url` is the file the phone recorded (H.264/AAC MP4 or MOV).
   */
  function mediaNode(item) {
    if (item.mediaKind === 'video') {
      return el('video', {
        src: item.url, poster: item.thumbUrl, controls: '',
        preload: 'none', playsinline: '',
      });
    }
    return el('a', { href: item.url, target: '_blank', rel: 'noopener' },
      el('img', { src: item.thumbUrl, alt: '', loading: 'lazy' }));
  }

  /** Thumbnails that open the full-size photo in a new tab. */
  function photoGrid(photos) {
    const grid = el('div', { class: photos.length === 1 ? 'grid single' : 'grid' });
    for (const photo of photos) grid.append(mediaNode(photo));
    return grid;
  }

  /** Read-only thread under a photo or a milestone. */
  function commentList(comments) {
    if (!comments || comments.length === 0) return null;
    const box = el('div', { class: 'comments' });
    for (const c of comments) {
      box.append(
        el('div', { class: 'comment' },
          el('div', { class: 'c-author' }, c.author),
          el('div', { class: 'c-body' }, c.body),
          el('div', { class: 'c-date' }, formatDate((c.createdAt || '').slice(0, 10))))
      );
    }
    return box;
  }

  function milestoneCard(item) {
    const meta = [formatAgeDays(item.ageDays), formatDate(item.occurredAt)]
      .filter(Boolean).join(' · ');
    return el('article', { class: 'card milestone' },
      el('div', { class: 'card-body' },
        el('div', { class: 'm-head' },
          el('div', { class: 'm-badge' }, badgeFor(item.templateKey)),
          el('div', {},
            el('div', { class: 'm-title' }, item.title),
            el('div', { class: 'm-meta' }, meta))),
        item.note ? el('p', { class: 'm-note' }, item.note) : null),
      item.photos.length > 0 ? photoGrid(item.photos) : null,
      commentList(item.comments));
  }

  function photoCard(photo) {
    const caption = [formatAgeDays(photo.ageDays), formatDate((photo.takenAt || '').slice(0, 10))]
      .filter(Boolean).join(' · ');
    return el('figure', {},
      mediaNode(photo),
      el('figcaption', {}, caption),
      commentList(photo.comments));
  }

  async function load() {
    const token = new URLSearchParams(location.search).get('t');
    if (!token) return showError();

    let data;
    try {
      const res = await fetch(API + '?t=' + encodeURIComponent(token));
      if (!res.ok) return showError();
      data = await res.json();
    } catch {
      return showError();
    }

    document.documentElement.lang = LANG;
    document.title = S.title(data.child.name);
    const app = document.getElementById('app');
    const nodes = [
      el('h1', {}, S.title(data.child.name)),
      el('p', { class: 'sub' }, S.sub(data.child.name)),
    ];

    // `items` is the current shape; `photos` keeps an older cached copy of
    // this page working if it ever loads against the new function.
    const items = data.items || (data.photos || []).map((p) => ({ kind: 'photo', ...p }));
    if (items.length === 0) {
      nodes.push(el('p', { class: 'empty' }, S.empty));
    }
    for (const item of items) {
      nodes.push(item.kind === 'milestone' ? milestoneCard(item) : photoCard(item));
    }

    nodes.push(el('footer', {}, S.footer));
    app.replaceChildren(...nodes);
  }

  load();
</script>
</body>
</html>
